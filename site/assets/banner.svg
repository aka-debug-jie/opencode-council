<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
 <title id="title">OpenCode Council — Codex leads, the council advises</title><desc id="desc">Codex uses a main model such as Sol, sends a brief to the Luna coordinator and three read-only participants, then makes the final decision and implements it. The main model is chosen in the Codex session, not fixed by this plugin.</desc>
 <rect width="1200" height="400" rx="16" fill="#f1f3e9"/>
 <path d="M640 30V370" stroke="#d9e0d1"/>
 <g font-family="Arial,Helvetica,sans-serif" fill="#202923"><text x="52" y="63" font-family="monospace" font-size="12" letter-spacing="2" fill="#245c45">THREE PERSPECTIVES. BOUNDED BY DESIGN.</text><text x="48" y="157" font-size="78" font-weight="700" letter-spacing="-4">Council</text><text x="54" y="202" font-size="20" fill="#626d64">Codex leads. The council advises.</text><text x="54" y="298" font-size="29" fill="#245c45">3 participants   /   2 rounds   /   12 dispatches</text><text x="54" y="342" font-family="monospace" font-size="11" fill="#626d64">v0.1 · PUBLIC · CODEX RETAINS FINAL JUDGMENT &amp; IMPLEMENTATION</text></g>
 <path d="M907 101V134M907 195V225M756 251V225H1058V251" fill="none" stroke="#a6b89b" stroke-width="2"/>
 <rect x="750" y="23" width="314" height="78" rx="8" fill="#202923"/>
 <g text-anchor="middle" font-family="Arial,Helvetica,sans-serif"><text x="907" y="49" fill="#fffef9" font-size="21" font-weight="700">Codex · Main task</text><text x="907" y="71" fill="#d6e8bf" font-size="13">Sol or your chosen main model</text><text x="907" y="89" fill="#b8c7ad" font-size="10">FULL CONTEXT · FINAL JUDGMENT · IMPLEMENTATION</text></g>
 <rect x="796" y="134" width="222" height="61" rx="6" fill="#e3ecd8" stroke="#c4d3ba"/>
 <g text-anchor="middle" font-family="Arial,Helvetica,sans-serif"><text x="907" y="155" fill="#4d674a" font-size="9">OPENCODE SIDECAR / COORDINATOR</text><text x="907" y="180" fill="#245c45" font-size="19">GPT 5.6 Luna</text></g>
 <g fill="#fffef9" stroke="#d2dcc9"><rect x="692" y="251" width="128" height="66" rx="6"/><rect x="843" y="251" width="128" height="66" rx="6"/><rect x="994" y="251" width="128" height="66" rx="6"/></g>
 <g text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#202923" font-size="21"><text x="756" y="279">Muse</text><text x="907" y="279">Qwen</text><text x="1058" y="279">GLM</text></g>
 <g text-anchor="middle" font-family="monospace" font-size="10" fill="#626d64"><text x="756" y="301">1.3 Contributor</text><text x="907" y="301">3.8 Flash</text><text x="1058" y="301">5.3 Flash</text><text x="907" y="351">REPORT → CODEX MAIN MODEL → JUDGMENT &amp; ACTION</text><text x="907" y="375" font-size="9">Sol is an example; the Codex session selects its main model.</text></g>
</svg>
